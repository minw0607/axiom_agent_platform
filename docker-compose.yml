# The keyless demo: one command, no API keys, no .env needed.
#
#   docker compose up -d --build
#   docker compose logs demo-keys      # the sign-in key for each role
#
# On first start the demo-keys service generates one API key per role, a secret for each MCP
# tool service and a tool gateway token for each workflow step into .demo/keys.env. Every
# other container starts through docker/with-demo-keys.sh, which hands it only the values
# named in its AXIOM_DEMO_KEYS and only where .env leaves them empty, so .env always wins.
#
# The platform reaches the tool services only through tool-gateway (ADR 0014). The services
# publish no ports; the gateway alone holds their secrets.
#
# Optional profiles: --profile evals (MLflow).

name: axiom

x-demo-keys: &demo-keys
  - ./.demo:/run/axiom-demo:ro
  - ./docker/with-demo-keys.sh:/usr/local/bin/with-demo-keys.sh:ro

x-after-demo-keys: &after-demo-keys
  demo-keys:
    condition: service_completed_successfully

services:
  demo-keys:
    image: axiom-platform:dev
    # Root only to write into the bind-mounted .demo folder; it exits once the file exists.
    user: "0"
    command: ["python", "-m", "axiom.demo_keys", "/run/axiom-demo/keys.env"]
    environment:
      # Read only to say which roles use keys from .env; those are never printed.
      SUBMITTER_API_KEYS: ${SUBMITTER_API_KEYS:-}
      REVIEWER_API_KEYS: ${REVIEWER_API_KEYS:-}
      AUDITOR_API_KEYS: ${AUDITOR_API_KEYS:-}
    volumes:
      - ./.demo:/run/axiom-demo

  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_USER: axiom
      POSTGRES_PASSWORD: axiom # local demo only
      POSTGRES_DB: axiom
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U axiom -d axiom"]
      interval: 5s
      timeout: 3s
      retries: 10

  phoenix:
    image: arizephoenix/phoenix:version-20.27.0
    environment:
      PHOENIX_WORKING_DIR: /phoenix
    ports:
      - "127.0.0.1:6006:6006" # trace UI
    volumes:
      - phoenix-data:/phoenix

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.163.2
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./config/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "127.0.0.1:4317:4317" # OTLP gRPC
      - "127.0.0.1:4318:4318" # OTLP HTTP
    depends_on:
      - phoenix

  regulus-mcp:
    image: regulus-mcp:0.2.1
    build:
      context: https://github.com/minw0607/Regulus.git#v0.2.1
    environment:
      MCP_SHARED_SECRET: ${REGULUS_MCP_SECRET:-}
      AXIOM_DEMO_KEYS: MCP_SHARED_SECRET=REGULUS_MCP_SECRET
      MCP_ALLOWED_HOSTS: localhost:*,127.0.0.1:*,regulus-mcp:*
    command: ["sh", "/usr/local/bin/with-demo-keys.sh", "python", "-m", "regulus.service"]
    depends_on: *after-demo-keys
    volumes: *demo-keys

  gkn-mcp:
    image: gkn-mcp:0.2.0
    build:
      context: https://github.com/minw0607/geometric_knowledge_network.git#v0.2.0
    environment:
      MCP_SHARED_SECRET: ${GKN_MCP_SECRET:-}
      AXIOM_DEMO_KEYS: MCP_SHARED_SECRET=GKN_MCP_SECRET
      MCP_ALLOWED_HOSTS: localhost:*,127.0.0.1:*,gkn-mcp:*
      GKN_REFERENCE_DIR: /references
    command:
      ["sh", "/usr/local/bin/with-demo-keys.sh", "python", "-m", "geometric_knowledge_network.service"]
    depends_on: *after-demo-keys
    volumes:
      - gkn-data:/data
      - ./.demo:/run/axiom-demo:ro
      - ./docker/with-demo-keys.sh:/usr/local/bin/with-demo-keys.sh:ro
      - ./data/synthetic/credit_policy:/references/credit_policy:ro
      - ./data/lending_refs:/references/lending_refs:ro

  # The only route to the tool services (ADR 0014). Each caller has its own token; every call,
  # allowed or refused, goes to a hash-chained log in the gateway-data volume.
  tool-gateway:
    image: axiom-platform:dev
    command: ["sh", "/usr/local/bin/with-demo-keys.sh", "python", "-m", "axiom.gateway.service"]
    environment:
      AXIOM_DEMO_KEYS: TOOL_GATEWAY_TOKENS TOOL_GATEWAY_OPERATOR_TOKEN GKN_MCP_SECRET REGULUS_MCP_SECRET
      TOOL_GATEWAY_TOKENS: ${TOOL_GATEWAY_TOKENS:-}
      TOOL_GATEWAY_OPERATOR_TOKEN: ${TOOL_GATEWAY_OPERATOR_TOKEN:-}
      GKN_MCP_URL: http://gkn-mcp:8002/mcp
      GKN_MCP_SECRET: ${GKN_MCP_SECRET:-}
      REGULUS_MCP_URL: http://regulus-mcp:8001/mcp
      REGULUS_MCP_SECRET: ${REGULUS_MCP_SECRET:-}
      MCP_ALLOWED_HOSTS: localhost:*,127.0.0.1:*,tool-gateway:*
    depends_on:
      demo-keys:
        condition: service_completed_successfully
      gkn-mcp:
        condition: service_started
      regulus-mcp:
        condition: service_started
    ports:
      - "127.0.0.1:8003:8003"
    volumes:
      - gateway-data:/var/lib/axiom-gateway
      - ./.demo:/run/axiom-demo:ro
      - ./docker/with-demo-keys.sh:/usr/local/bin/with-demo-keys.sh:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8003/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    image: axiom-platform:dev
    build: .
    command: ["sh", "/usr/local/bin/with-demo-keys.sh", "python", "-m", "axiom.api"]
    volumes: *demo-keys
    environment:
      <<: &platform-env
        AXIOM_MODE: ${AXIOM_MODE:-demo}
        AXIOM_API_HOST: 0.0.0.0
        DATABASE_URL: postgresql://axiom:axiom@postgres:5432/axiom
        TOOL_GATEWAY_URL: http://tool-gateway:8003/mcp
        OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
        MODEL_ALIAS_MAP: ${MODEL_ALIAS_MAP:-}
        OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AXIOM_DEMO_KEYS: SUBMITTER_API_KEYS REVIEWER_API_KEYS AUDITOR_API_KEYS
      SUBMITTER_API_KEYS: ${SUBMITTER_API_KEYS:-}
      REVIEWER_API_KEYS: ${REVIEWER_API_KEYS:-}
      AUDITOR_API_KEYS: ${AUDITOR_API_KEYS:-}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      demo-keys:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/ready')"]
      interval: 10s
      timeout: 3s
      retries: 5

  worker:
    image: axiom-platform:dev
    command: ["sh", "/usr/local/bin/with-demo-keys.sh", "python", "-m", "axiom.jobs.worker"]
    volumes: *demo-keys
    environment:
      <<: *platform-env
      # The workflow steps' gateway tokens only: never the operator token or a service secret.
      AXIOM_DEMO_KEYS: TOOL_GATEWAY_TOKENS
      TOOL_GATEWAY_TOKENS: ${TOOL_GATEWAY_TOKENS:-}
    depends_on:
      demo-keys:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      api:
        condition: service_started
      tool-gateway:
        condition: service_started

  # Evaluation runs (week 6). Optional: docker compose --profile evals up -d mlflow
  # Then: MLFLOW_TRACKING_URI=http://localhost:5050 uv run --group evals python evals/baseline.py --mlflow
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.18.0
    profiles: ["evals"]
    command:
      - mlflow
      - server
      - --host=0.0.0.0
      - --port=5000
      - --backend-store-uri=sqlite:////mlflow/mlflow.db
      - --artifacts-destination=/mlflow/artifacts
      - --serve-artifacts
      - --allowed-hosts=localhost:5050,127.0.0.1:5050
    ports:
      - "127.0.0.1:5050:5000" # eval UI, local only (macOS AirPlay holds port 5000)
    volumes:
      - mlflow-data:/mlflow

volumes:
  postgres-data:
  phoenix-data:
  gkn-data:
  gateway-data:
  mlflow-data:

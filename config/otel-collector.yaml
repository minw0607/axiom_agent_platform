# OpenTelemetry Collector: receive OTLP from the platform, batch, and forward to Phoenix.
# In the cloud environment the exporter changes to Azure Monitor; Phoenix stays local.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}

exporters:
  otlp_grpc/phoenix:
    endpoint: phoenix:4317
    tls:
      insecure: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp_grpc/phoenix]

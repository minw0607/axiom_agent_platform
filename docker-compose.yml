# The keyless demo: one command, no API keys, no .env needed.
#
#   docker compose up -d --build
#   docker compose logs demo-keys      # the sign-in key for each role
#
# On first start the demo-keys service generates the MCP shared secret and one API key per
# role into .demo/keys.env. Every other container starts through docker/with-demo-keys.sh,
# which fills in only what .env leaves empty, so values set in .env always win.
#
# Optional profiles: --profile evals (MLflow).

name: axiom

x-demo-keys: &demo-keys
  - ./.demo:/run/axiom-demo:ro
  - ./docker/with-demo-keys.sh:/usr/local/bin/with-demo-keys.sh:ro

x-after-demo-keys: &after-demo-keys
  demo-keys:
    condition: service_completed_successfully

services:
  demo-keys:
    image: axiom-platform:dev
    # Root only to write into the bind-mounted .demo folder; it exits once the file exists.
    user: "0"
    command: ["python", "-m", "axiom.demo_keys", "/run/axiom-demo/keys.env"]
    environment:
      # Read only to say which roles use keys from .env; those are never printed.
      SUBMITTER_API_KEYS: ${SUBMITTER_API_KEYS:-}
      REVIEWER_API_KEYS: ${REVIEWER_API_KEYS:-}
      AUDITOR_API_KEYS: ${AUDITOR_API_KEYS:-}
    volumes:
      - ./.demo:/run/axiom-demo

  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_USER: axiom
      POSTGRES_PASSWORD: axiom # local demo only
      POSTGRES_DB: axiom
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U axiom -d axiom"]
      interval: 5s
      timeout: 3s
      retries: 10

  phoenix:
    image: arizephoenix/phoenix:version-20.27.0
    environment:
      PHOENIX_WORKING_DIR: /phoenix
    ports:
      - "127.0.0.1:6006:6006" # trace UI
    volumes:
      - phoenix-data:/phoenix

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.163.2
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./config/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "127.0.0.1:4317:4317" # OTLP gRPC
      - "127.0.0.1:4318:4318" # OTLP HTTP
    depends_on:
      - phoenix

  regulus-mcp:
    image: regulus-mcp:0.2.1
    build:
      context: https://github.com/minw0607/Regulus.git#v0.2.1
    environment:
      MCP_SHARED_SECRET: ${MCP_SHARED_SECRET:-}
      MCP_ALLOWED_HOSTS: localhost:*,127.0.0.1:*,regulus-mcp:*
    command: ["sh", "/usr/local/bin/with-demo-keys.sh", "python", "-m", "regulus.service"]
    depends_on: *after-demo-keys
    ports:
      - "127.0.0.1:8001:8001"
    volumes: *demo-keys

  gkn-mcp:
    image: gkn-mcp:0.2.0
    build:
      context: https://github.com/minw0607/geometric_knowledge_network.git#v0.2.0
    environment:
      MCP_SHARED_SECRET: ${MCP_SHARED_SECRET:-}
      MCP_ALLOWED_HOSTS: localhost:*,127.0.0.1:*,gkn-mcp:*
      GKN_REFERENCE_DIR: /references
    command:
      ["sh", "/usr/local/bin/with-demo-keys.sh", "python", "-m", "geometric_knowledge_network.service"]
    depends_on: *after-demo-keys
    ports:
      - "127.0.0.1:8002:8002"
    volumes:
      - gkn-data:/data
      - ./.demo:/run/axiom-demo:ro
      - ./docker/with-demo-keys.sh:/usr/local/bin/with-demo-keys.sh:ro
      - ./data/synthetic/credit_policy:/references/credit_policy:ro
      - ./data/lending_refs:/references/lending_refs:ro

  api:
    image: axiom-platform:dev
    build: .
    command: ["sh", "/usr/local/bin/with-demo-keys.sh", "python", "-m", "axiom.api"]
    volumes: *demo-keys
    environment: &platform-env
      AXIOM_MODE: ${AXIOM_MODE:-demo}
      AXIOM_API_HOST: 0.0.0.0
      DATABASE_URL: postgresql://axiom:axiom@postgres:5432/axiom
      GKN_MCP_URL: http://gkn-mcp:8002/mcp
      REGULUS_MCP_URL: http://regulus-mcp:8001/mcp
      MCP_SHARED_SECRET: ${MCP_SHARED_SECRET:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      SUBMITTER_API_KEYS: ${SUBMITTER_API_KEYS:-}
      REVIEWER_API_KEYS: ${REVIEWER_API_KEYS:-}
      AUDITOR_API_KEYS: ${AUDITOR_API_KEYS:-}
      MODEL_ALIAS_MAP: ${MODEL_ALIAS_MAP:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      demo-keys:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/ready')"]
      interval: 10s
      timeout: 3s
      retries: 5

  worker:
    image: axiom-platform:dev
    command: ["sh", "/usr/local/bin/with-demo-keys.sh", "python", "-m", "axiom.jobs.worker"]
    volumes: *demo-keys
    environment: *platform-env
    depends_on:
      demo-keys:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      api:
        condition: service_started
      gkn-mcp:
        condition: service_started

  # Evaluation runs (week 6). Optional: docker compose --profile evals up -d mlflow
  # Then: MLFLOW_TRACKING_URI=http://localhost:5050 uv run --group evals python evals/baseline.py --mlflow
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.18.0
    profiles: ["evals"]
    command:
      - mlflow
      - server
      - --host=0.0.0.0
      - --port=5000
      - --backend-store-uri=sqlite:////mlflow/mlflow.db
      - --artifacts-destination=/mlflow/artifacts
      - --serve-artifacts
      - --allowed-hosts=localhost:5050,127.0.0.1:5050
    ports:
      - "127.0.0.1:5050:5000" # eval UI, local only (macOS AirPlay holds port 5000)
    volumes:
      - mlflow-data:/mlflow

volumes:
  postgres-data:
  phoenix-data:
  gkn-data:
  mlflow-data:

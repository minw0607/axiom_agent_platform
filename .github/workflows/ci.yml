name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_USER: axiom
          POSTGRES_PASSWORD: axiom # CI only
          POSTGRES_DB: axiom
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U axiom -d axiom"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Type check
        run: uv run mypy
      - name: Tests
        run: uv run pytest
      # ADR 0008's thresholds on the golden set, the fairness pairs and the attack set,
      # replayed with no keys; the attacks run with the guardrails as configured.
      - name: Release gates
        run: uv run python evals/gate.py

  # The keyless demo as a stranger runs it: build every image, start the stack with no .env,
  # and check it end to end (dev plan 9.5, stage 4).
  stack:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install
        run: uv sync --locked
      - name: Start the stack
        run: docker compose up -d --build
      # Phoenix takes a few seconds longer than the API, so wait for each published service.
      - name: Wait for the services
        run: |
          for url in http://localhost:8000/v1/ready http://localhost:8003/healthz http://localhost:6006; do
            for i in $(seq 1 90); do
              curl -sf "$url" > /dev/null && continue 2
              sleep 2
            done
            echo "not ready: $url" && exit 1
          done
      - name: Gate 1 checks
        run: uv run python scripts/check_gate1.py
      - name: Gate 2 checks
        run: uv run python scripts/check_gate2.py
      - name: Release gates on the live recordings
        run: uv run python evals/gate.py --stack
      # Not demo-keys: its log holds this run's generated sign-in keys.
      - name: Service logs
        if: failure()
        run: docker compose logs --no-color --tail 200 api worker tool-gateway gkn-mcp regulus-mcp

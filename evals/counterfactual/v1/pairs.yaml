# Counterfactual pairs v1 (week 6). Each pair adds one sentence about the owner to a
# package's business description; the two sentences differ only in a characteristic that
# the Equal Credit Opportunity Act and Regulation B make a prohibited basis. The figures,
# and every line number, are identical, so ratios, risk flags, rule findings and the draft
# recommendation must be identical too.
#
# Packages near the policy limits are used most, because that is where a biased judgment
# could tip a recommendation. Names are run as well, though redaction masks full names
# before any model sees them; the report says when that happened.
#
# All people described here are fictional. These are tests on synthetic data, not a
# fair-lending conclusion.
version: 1
pairs:

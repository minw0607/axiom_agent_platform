[project]
name = "axiom-agent-platform"
version = "0.0.1"
description = "A governed multi-agent platform for commercial lending."
readme = "README.md"
license = "MIT"
authors = [{ name = "Min Wu" }]
requires-python = ">=3.11,<3.12"
dependencies = [
    "mcp>=2.3,<3",
]

[dependency-groups]
dev = [
  "mypy>=1.10",
  "pytest>=8.0",
  "ruff>=0.6",
  "uvicorn>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/axiom"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["axiom"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Import from src directly: macOS can flag uv's editable-install .pth file as hidden,
# and Python skips hidden .pth files.
pythonpath = ["src"]
addopts = "-ra"
